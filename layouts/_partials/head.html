<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<meta name="author" content="{{ site.Params.author }}">
<link rel="canonical" href="{{ .Permalink }}">
{{ range .AllTranslations -}}
<link rel="alternate" hreflang="{{ .Language.Locale }}" href="{{ .Permalink }}">
{{ end -}}
<meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ site.Params.photo | absURL }}">
<link rel="icon" href="{{ "favicon.ico" | relURL }}" sizes="32x32">
<link rel="icon" href="{{ "favicon-32x32.png" | relURL }}" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
{{ with resources.Get "css/style.css" | minify | fingerprint -}}
<link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">
{{ end -}}
<noscript><style>@media (max-width: 768px) { .site-nav ul { display: flex !important; } }</style></noscript>
{{ if site.Params.mysite.discovery -}}
<meta name="generator" content="Created using GaryKing.org/mysite (https://gking.harvard.edu/mysite)">
{{ if .IsHome -}}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Person","name":"{{ site.Params.author }}","affiliation":{"@type":"Organization","name":"Department of Government, Harvard University"},"url":"{{ site.BaseURL }}","isBasedOn":"https://gking.harvard.edu/mysite"}
</script>
{{ end -}}
{{ end -}}
