title: "Digital Party-Building"
summary: >-
  How do parties get built in the digital age? My book-length dissertation project explores this
  question in depth, motivated by the surprising party-building successes of political
  entrepreneurs like Jair Bolsonaro in Brazil and Javier Milei in Argentina. I argue that digital
  media is the key to the establishment of their political projects as mass movements with strong
  programmatic identity and legislative discipline. Using novel social media data, qualitative
  fieldwork, and leveraging natural experiments, the project will illustrate the perks and
  challenges of using digital media to build political organizations.
