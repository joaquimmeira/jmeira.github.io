- title: "Tapped on the Shoulder: How Executives Influence Electoral Careers in Presidentialism"
  coauthors:
    - name: "Timothy J. Power"
      url: "https://www.socsci.ox.ac.uk/people/professor-timothy-power"
    - name: "Cesar Zucco"
      url: "https://blogs.cuit.columbia.edu/cz2972/"
  status: "forthcoming"
  venue: "Comparative Political Studies"
  abstract: >-
    How do political appointments affect electoral careers? Despite a large literature on
    political ambition and career trajectories around the globe, insufficient attention has been
    paid to the role of appointments made by elected executives to cabinet positions in
    presidential systems. We study this phenomenon in the context of Brazil, a three-tiered
    federation with multiple career paths. We survey members of Congress to create a hierarchy
    of perceived political value for various public offices. Then, using original data on
    politicians’ career trajectories and matching methods to create comparable groups of
    appointed and non-appointed politicians, we test hypotheses on their subsequent ambition and
    electoral success. Compared to similar politicians who were not appointed to executive
    office, appointees have higher probabilities of entering electoral politics and winning
    elections. For experienced politicians, appointments both stimulate progressive ambition and
    contribute to electoral success. Elected executives are career-makers in presidential
    systems, boosting and launching careers through appointments.

