- title: "Appointments and Disappointments: Revisiting Political Ambition in Brazil"
  coauthors:
    - name: "Timothy J. Power"
      url: "https://www.socsci.ox.ac.uk/people/professor-timothy-power"
    - name: "Cesar Zucco"
      url: "https://blogs.cuit.columbia.edu/cz2972/"
  status: "revise and resubmit"
  venue: "Comparative Political Studies"
  abstract: >-
    How do political appointments affect electoral careers? Although there exists a broad
    literature on political ambition and career trajectories across the globe, little attention
    has been paid to the role of appointments to cabinet positions and their subnational
    counterparts. We study this phenomenon in the context of Brazil, a three-tiered federation
    with multiple appointed positions and possible career paths for politicians. First, we field
    an elite survey and an expert survey asking Brazilian members of congress and academics
    respectively to rate the relative status of different appointed and elected positions and
    employ a novel method to create a ranking from pairwise comparisons. We then assemble an
    original panel of politicians' career trajectories, including appointed positions. Finally,
    we test hypotheses on how appointments affect political ambition and electoral success, using
    matching methods to create comparable groups of appointed and non-appointed politicians.
    Preliminary results suggest that appointments both boost and launch careers; the appointed
    have higher chances of running for and winning higher-ranked office than similar politicians
    who were not appointed to an executive position. We also find that appointments decrease the
    likelihood that politicians run for lower-ranked positions, which would serve as a "second
    best" to stay relevant between electoral cycles.

