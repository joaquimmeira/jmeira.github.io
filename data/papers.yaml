- title: "Breaking the Incumbency Curse? Political Campaigns and the Incumbent's (Dis)Advantage in Brazilian Municipal Elections"
  coauthors:
    - name: "Lucas Borba"
      url: "https://lucas-borba.com/"
  status: "working paper"
  abstract: >-
    The incumbency advantage is an established finding for developed democracies, but many
    studies identify incumbency disadvantages or null effects in developing countries. While name
    recognition is widely regarded as a source of incumbency advantage, few analyses investigate
    whether it is a factor in developing democracies. We exploit exogenous judicial decisions
    that banned street campaigns in some Brazilian states for the 2020 municipal elections due to
    the coronavirus pandemic. This allows us to isolate the effects of campaigns, which should be
    important for challengers to advertise their candidacies, on electoral outcomes. We expect
    that the ban on street campaigns should favor incumbent candidates, who have a comparative
    advantage in terms of name recognition among voters. In the absence of canvassing and
    in-person campaign strategies — very common and important in Brazil — voters should prefer to
    vote for candidates that they already know rather than taking the risk of voting for unknown
    challengers. We also investigate effects on voter turnout, which should be lower where
    campaigns are limited, and on campaign spending strategies, which should shift towards social
    media.

- title: "Local Party Ideology in Heterogeneous Party Systems"
  status: "working paper"
  abstract: >-
    How does party ideology vary subnationally in Brazil? Although the country is known for its
    weak party system composed of many heterogeneous parties, there are still no suitable
    measures of party ideology at the local level. This project attempts to fill this gap by
    employing supervised machine learning methods. By cross-referencing roll-call voting ideal
    point estimation with campaign platforms of mayoral candidates and exploiting the fact that
    many legislators run for mayor, I build a model to infer candidate ideology from the text of
    their platforms.
